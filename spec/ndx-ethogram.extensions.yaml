groups:
- neurodata_type_def: Ethogram
  neurodata_type_inc: DynamicTable
  doc: "The behavior catalogue / coding scheme (the classical ethogram): one row per
    behavior TYPE, including types that did not occur this session (the full output
    space). A standalone DynamicTable that EthogramBouts (and a future point-behavior
    EthogramEvents) reference via their optional `ethogram` link; a bout's text `label`
    matches this table's `name` column. Holds per-type, occurrence-invariant metadata
    the per-bout table cannot: the complete repertoire, the state/point kind, the
    tool's native code, and the hierarchy grouping."
  attributes:
  - name: exclusive
    dtype: bool
    doc: True if the scheme is a single-label partition (mutually exclusive 
      behaviors, e.g. VAME motifs, keypoint-MoSeq syllables, CalMS21); False if 
      independent multi-label behaviors can co-occur (DeepEthogram, SimBA). 
      Tells a consumer whether overlapping EthogramBouts rows are expected.
    required: false
  datasets:
  - name: behavior
    neurodata_type_inc: VectorData
    dtype: text
    doc: Behavior name / id, the join key an EthogramBouts `label` matches 
      (required). A human-readable name for named producers; the tool's own 
      cluster/motif/syllable id as text (e.g. '7') for integer-only unsupervised
      producers. (Not named 'name' because that collides with the DynamicTable's
      own name attribute.)
  - name: definition
    neurodata_type_inc: VectorData
    dtype: text
    doc: Operational definition of the behavior (required; may be brief, or a 
      placeholder for unsupervised cluster ids that have no a-priori meaning). 
      (Not named 'description' because that collides with the DynamicTable's own
      description.)
  - name: behavior_type
    neurodata_type_inc: VectorData
    dtype: text
    doc: "'state' (durative -> EthogramBouts) or 'point' (instantaneous -> a future
      EthogramEvents). Optional; all current pose-segmentation tools emit only 'state'."
    quantity: '?'
  - name: native_code
    neurodata_type_inc: VectorData
    dtype: int
    doc: The producing tool's own integer id for this behavior (a VAME motif 
      number, a CalMS21 class id), recorded once here rather than per bout. 
      Optional; absent for named producers that supply no native integer.
    quantity: '?'
  - name: category
    neurodata_type_inc: VectorData
    dtype: text
    doc: Hierarchy / grouping for this behavior (a VAME community, a BORIS 
      behavioral category). The normalized home of the motif->community mapping.
      Optional.
    quantity: '?'
- neurodata_type_def: EthogramBouts
  neurodata_type_inc: TimeIntervals
  doc: "A curated, tool-agnostic ethogram stored as labeled behavioral bouts: one
    row per bout (a continuous interval of a single behavior), inheriting start_time
    and stop_time from TimeIntervals. A downstream-oriented, lossy-by-design product
    of behavioral segmentation/classification tools (VAME motifs, keypoint-MoSeq syllables,
    B-SOiD clusters, DeepEthogram/SimBA behaviors); the tool's faithful native output
    lives in its own extension and is referenced via the generic `source` link. Overlapping
    behaviors are overlapping rows. Holds only durative (state) behaviors; instantaneous
    point behaviors belong in an EventsTable."
  attributes:
  - name: labeling_method
    dtype: text
    doc: "How the labels were produced: 'manual' (a human scored the video), 'automated'
      (an algorithm), or 'curated' (human-reviewed model output). Required so annotation
      and prediction tables are never indistinguishable."
  - name: source_software
    dtype: text
    doc: Producing tool and version for 'automated'/'curated' output, e.g. 'VAME
      1.1'.
    required: false
  - name: annotator
    dtype: text
    doc: The human or lab who produced 'manual'/'curated' labels.
    required: false
  - name: parameters
    dtype: text
    doc: 'Optional JSON-encoded provenance: key hyperparameters (n_cluster, time_window,
      kappa, ...).'
    required: false
  datasets:
  - name: label
    neurodata_type_inc: VectorData
    dtype: text
    doc: "Behavior/motif/syllable/cluster identity for each bout (required). A single
      text column: a human-readable name for named producers (DeepEthogram, SimBA,
      CalMS21, CRIM13 behaviors); for integer-only unsupervised producers (VAME, keypoint-MoSeq,
      B-SOiD) it is the tool's own cluster id rendered as text (e.g. '7'). Text rather
      than a separate integer code because unsupervised cluster ids are arbitrary
      and run-specific, not a stable canonical identity, so a parallel integer key
      earns nothing the string does not already carry."
  links:
  - name: source
    target_type: NWBDataInterface
    doc: The producing faithful object these bouts were derived from (e.g. a 
      VAMEProject or MotifSeries). Generic target keeps ndx-ethogram 
      tool-agnostic (no dependency on any tool-faithful extension).
    quantity: '?'
  - name: source_pose
    target_type: PoseEstimation
    doc: The upstream ndx-pose PoseEstimation these bouts were derived from 
      (pose-based tools).
    quantity: '?'
  - name: source_video
    target_type: ImageSeries
    doc: The behavioral video the bouts align to.
    quantity: '?'
  - name: observation_intervals
    target_type: TimeIntervals
    doc: Spans over which the labels were assessed (partial-annotation inputs 
      only). Within them, absence of a bout means the behavior was absent; 
      outside, unobserved. Omitted means assessed throughout (full coverage). A 
      plain core TimeIntervals; not invalid_times.
    quantity: '?'
  - name: ethogram
    target_type: Ethogram
    doc: "The behavior catalogue (coding scheme) these bouts draw their labels from;
      a bout's `label` matches a row's `behavior` column. Optional: the text `label`
      is self-sufficient, the catalogue adds the full output space and per-type metadata
      when present."
    quantity: '?'
